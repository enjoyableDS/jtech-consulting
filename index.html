<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JTECH 단열탄성 상담 시스템 (공용)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4396">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/1b4396/ffffff?text=JTECH">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Modular v9) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAu_nhpHAOKOuozczp7dI8ywBfSg3aKfQk",
      authDomain: "jtech-01.firebaseapp.com",
      projectId: "jtech-01",
      storageBucket: "jtech-01.firebasestorage.app",
      messagingSenderId: "467197970168",
      appId: "1:467197970168:web:1220210ce33675549f9d0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DEFAULT_CATEGORIES = [
      "사업자", "인증서", "시공전", "시공후", "자재안내",
      "시공과정", "가격표", "A/S규정", "고객후기", "기타안내"
    ];

    window.categories = [];
    window.mediaStorage = {};
    window.currentCategoryId = null;
    window.currentMediaList = [];
    window.currentViewerIndex = 0;
    window.isFitContain = true;
    window.currentSortOrder = "asc";
    let isInitialized = false;

    // 실시간 데이터 동기화 리스너 설정
    window.initFirebaseSync = async function() {
      const catSnapshot = await getDocs(collection(db, "categories"));
      if (catSnapshot.empty) {
        for (let i = 0; i < DEFAULT_CATEGORIES.length; i++) {
          const catId = "cat_" + Date.now() + "_" + i;
          await setDoc(doc(db, "categories", catId), { name: DEFAULT_CATEGORIES[i], order: i });
        }
      }

      // 1. 카테고리 실시간 동기화
      onSnapshot(collection(db, "categories"), (snapshot) => {
        let loadedCats = [];
        snapshot.forEach((docSnap) => {
          loadedCats.push({ id: docSnap.id, ...docSnap.data() });
        });

        window.categories = loadedCats.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        if (!window.currentCategoryId && window.categories.length > 0) {
          window.currentCategoryId = window.categories[0].id;
        }
        renderCategoryGrid();
        if (!document.getElementById("admin-modal").classList.contains("hidden")) {
          renderAdminCategories();
        }
      });

      // 2. 미디어 파일 실시간 동기화
      onSnapshot(collection(db, "media"), (snapshot) => {
        window.mediaStorage = {};
        window.categories.forEach(c => window.mediaStorage[c.id] = []);
        
        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          if (!window.mediaStorage[item.categoryId]) {
            window.mediaStorage[item.categoryId] = [];
          }
          window.mediaStorage[item.categoryId].push(item);
        });

        renderCategoryGrid();
        if (window.currentCategoryId) {
          if (!document.getElementById("view-gallery").classList.contains("hidden")) {
            openCategory(window.currentCategoryId);
          }
          if (!document.getElementById("admin-modal").classList.contains("hidden")) {
            renderAdminMediaGrid();
          }
        }
      });
    };

    window.dbOps = {
      saveCategory: async (id, data) => {
        await setDoc(doc(db, "categories", id), data, { merge: true });
      },
      deleteCategory: async (id) => {
        await deleteDoc(doc(db, "categories", id));
      },
      saveMedia: async (id, data) => {
        await setDoc(doc(db, "media", id), data, { merge: true });
      },
      deleteMedia: async (id) => {
        await deleteDoc(doc(db, "media", id));
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.initFirebaseSync();
      initSwipeGesture();
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#1b4396',
            brandDark: '#122e69',
            brandLight: '#eef3fc'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    
    /* 모바일 터치 및 가로 스크롤 최적화 */
    .custom-scrollbar {-webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; overscroll-behavior-x: contain;}
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    
    .media-fit-contain { object-fit: contain; }
    .media-fit-cover { object-fit: cover; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen h-[100dvh] flex flex-col overflow-hidden">

    <!-- TOP CATEGORY MENU BAR (PC 중앙정렬 및 모바일 가로 스크롤 구조) -->
    <nav id="top-category-bar" class="overflow-x-auto custom-scrollbar pb-2 pt-1 border-t border-gray-100 w-full whitespace-nowrap px-1">
      <div id="top-category-inner" class="flex items-center justify-start sm:justify-center gap-2 min-w-max mx-auto"></div>

  <main class="flex-1 min-h-0 relative overflow-y-auto custom-scrollbar p-6">

    <!-- 좌우 이동 화살표 버튼 (모바일에서는 숨김, 태블릿/PC 이상에서 노출) -->

              <input type="file" id="media-file-input" multiple accept="image/*,video/*" class="hidden" onchange="handleFileUpload(event)">

            <label class="border-2 border-dashed border-brand/40 hover:border-brand rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer bg-brandLight/20 hover:bg-brandLight/50 transition text-center">
              <i class="fa-solid fa-folder-plus text-2xl text-brand mb-1.5"></i>
              <span class="text-sm font-bold text-brand">폴더 통째로 가져오기</span>
              <input type="file" id="media-folder-input" webkitdirectory directory multiple class="hidden" onchange="handleFileUpload(event)">
            </label>
          </div>
          <div id="admin-media-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 pb-6"></div>
        </div>
      </div>
      <div class="px-6 py-3 bg-gray-100 border-t border-gray-200 flex justify-between items-center text-xs text-gray-500 shrink-0">
        <span>* 클라우드 DB 연동으로 접속한 모든 기기에서 실시간 동기화됩니다.</span>
        <button onclick="toggleAdminModal(false)" class="px-5 py-2 bg-brand text-white font-bold rounded-lg hover:bg-brandDark transition">완료 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- CLIENT LOGIC -->
  <script>
    function sortMediaArray(items) {
      if (!items || !Array.isArray(items)) return [];
      const copy = [...items];
      if (window.currentSortOrder === "asc") {
        return copy.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko", { numeric: true, sensitivity: "base" }));
      } else if (window.currentSortOrder === "desc") {
        return copy.sort((a, b) => (b.name || "").localeCompare(a.name || "", "ko", { numeric: true, sensitivity: "base" }));
      } else {
        return copy.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      }
    }

    function changeSortOrder(order) {
      window.currentSortOrder = order;
      if (window.currentCategoryId) {
        if (!document.getElementById("view-gallery").classList.contains("hidden")) {
          openCategory(window.currentCategoryId);
        }
        if (!document.getElementById("admin-modal").classList.contains("hidden")) {
          renderAdminMediaGrid();
        }
      }
    }

    function renderCategoryGrid() {
      renderTopCategoryBar();
      const grid = document.getElementById("category-grid");
      if (!grid) return;
      grid.innerHTML = "";

      window.categories.forEach(cat => {
        const items = window.mediaStorage[cat.id] || [];
        const card = document.createElement("div");
        card.className = "group relative bg-white border-[3px] border-brand rounded-2xl aspect-square flex flex-col items-center justify-center p-4 cursor-pointer hover:bg-brandLight/50 hover:shadow-xl transition-all duration-200 active:scale-95";
        card.onclick = () => openCategory(cat.id);
        card.innerHTML = `
          <span class="text-xl sm:text-2xl font-black text-brand text-center group-hover:scale-105 transition-transform duration-200 leading-tight">${cat.name}</span>
          ${items.length > 0 ? `<span class="absolute bottom-3 right-3 text-[11px] font-bold bg-brand text-white px-2 py-0.5 rounded-full">${items.length}</span>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function renderTopCategoryBar() {
      const topBarInner = document.getElementById("top-category-inner");
      if (!topBarInner) return;
      topBarInner.innerHTML = "";

      window.categories.forEach(cat => {
        const isSelected = window.currentCategoryId === cat.id;
        const btn = document.createElement("button");
        btn.className = `whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shrink-0 ${isSelected ? 'bg-brand text-white shadow-sm' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`;
        btn.onclick = () => openCategory(cat.id);
        const count = (window.mediaStorage[cat.id] || []).length;
        btn.innerHTML = `<span>${cat.name}</span><span class="text-[10px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-white/20 text-white' : 'bg-gray-200 text-gray-600'}">${count}</span>`;
        topBarInner.appendChild(btn);
      });
    }

    function openCategory(catId) {
      window.currentCategoryId = catId;
      renderTopCategoryBar();
      const category = window.categories.find(c => c.id === catId);
      if (!category) return;

      const rawItems = window.mediaStorage[catId] || [];
      const items = sortMediaArray(rawItems);

      document.getElementById("current-category-name").innerText = category.name;
      document.getElementById("current-category-count").innerText = `총 ${items.length}개의 미디어 파일`;
      document.getElementById("header-title").innerHTML = `<span class="text-brand">${category.name}</span>`;

      const galleryGrid = document.getElementById("gallery-grid");
      const emptyState = document.getElementById("gallery-empty");
      galleryGrid.innerHTML = "";

      if (items.length === 0) {
        galleryGrid.classList.add("hidden");
        emptyState.classList.remove("hidden");
        emptyState.classList.add("flex");
      } else {
        galleryGrid.classList.remove("hidden");
        emptyState.classList.add("hidden");
        emptyState.classList.remove("flex");

        items.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md cursor-pointer aspect-square relative group";
          card.onclick = () => openViewer(idx);

          if (item.type && item.type.startsWith("image/")) {
            card.innerHTML = `
              <img src="${item.dataUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.name}">
              <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-2"><p class="text-[11px] text-white font-medium truncate">${item.name}</p></div>
            `;
          } else {
            card.innerHTML = `
              <video src="${item.dataUrl}" class="w-full h-full object-cover"></video>
              <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-2"><p class="text-[11px] text-white font-medium truncate">${item.name}</p></div>
            `;
          }
          galleryGrid.appendChild(card);
        });
      }

      document.getElementById("view-categories").classList.add("hidden");
      document.getElementById("view-gallery").classList.remove("hidden");
      document.getElementById("btn-home").classList.remove("hidden");
    }

    function goHome() {
      window.currentCategoryId = null;
      renderCategoryGrid();
      document.getElementById("view-categories").classList.remove("hidden");
      document.getElementById("view-gallery").classList.add("hidden");
      document.getElementById("btn-home").classList.add("hidden");
      document.getElementById("header-title").innerHTML = `<span>고객 상담 카탈로그</span>`;
    }

    function openViewer(index) {
      if (!window.currentCategoryId) return;
      window.currentMediaList = sortMediaArray(window.mediaStorage[window.currentCategoryId] || []);
      if (window.currentMediaList.length === 0) return;
      window.currentViewerIndex = index;
      document.getElementById("viewer-modal").classList.remove("hidden");
      updateViewerContent();
    }

    function updateViewerContent() {
      const item = window.currentMediaList[window.currentViewerIndex];
      const category = window.categories.find(c => c.id === window.currentCategoryId);
      document.getElementById("viewer-category-tag").innerText = category ? category.name : "";
      document.getElementById("viewer-title").innerText = item.name;
      document.getElementById("viewer-index").innerText = window.currentViewerIndex + 1;
      document.getElementById("viewer-total").innerText = window.currentMediaList.length;

      const imgEl = document.getElementById("viewer-image");
      const videoEl = document.getElementById("viewer-video");

      if (item.type && item.type.startsWith("image/")) {
        videoEl.pause();
        videoEl.classList.add("hidden");
        imgEl.src = item.dataUrl;
        imgEl.classList.remove("hidden");
      } else {
        imgEl.classList.add("hidden");
        videoEl.src = item.dataUrl;
        videoEl.classList.remove("hidden");
        videoEl.play().catch(() => {});
      }
    }

    function closeViewer() {
      document.getElementById("viewer-video").pause();
      document.getElementById("viewer-modal").classList.add("hidden");
    }

    function nextMedia() {
      if (window.currentMediaList.length === 0) return;
      window.currentViewerIndex = (window.currentViewerIndex + 1) % window.currentMediaList.length;
      updateViewerContent();
    }

    function prevMedia() {
      if (window.currentMediaList.length === 0) return;
      window.currentViewerIndex = (window.currentViewerIndex - 1 + window.currentMediaList.length) % window.currentMediaList.length;
      updateViewerContent();
    }

    function toggleMediaFit() {
      window.isFitContain = !window.isFitContain;
      const imgEl = document.getElementById("viewer-image");
      const videoEl = document.getElementById("viewer-video");
      const fitIcon = document.getElementById("fit-icon");

      if (window.isFitContain) {
        imgEl.className = "w-full h-full media-fit-contain";
        videoEl.className = "w-full h-full media-fit-contain";
        fitIcon.className = "fa-solid fa-expand";
      } else {
        imgEl.className = "w-full h-full media-fit-cover";
        videoEl.className = "w-full h-full media-fit-cover";
        fitIcon.className = "fa-solid fa-compress";
      }
    }

    // 모바일 터치 및 PC 마우스 드래그(스와이프) 제스처 구현
    function initSwipeGesture() {
      const container = document.getElementById("viewer-container");
      if (!container) return;

      let startX = 0;
      let startY = 0;
      let isDragging = false;
      const threshold = 50; // 스와이프 인식 최소 거리 (px)

      // 터치 시작 (모바일)
      container.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          isDragging = true;
        }
      }, { passive: true });

      // 마우스 클릭 시작 (PC)
      container.addEventListener("mousedown", (e) => {
        startX = e.clientX;
        startY = e.clientY;
        isDragging = true;
      });

      // 터치 이동/종료 (모바일)
      container.addEventListener("touchend", (e) => {
        if (!isDragging) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        handleSwipe(startX, startY, endX, endY, threshold);
        isDragging = false;
      }, { passive: true });

      // 마우스 이동/종료 (PC)
      container.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        const endX = e.clientX;
        const endY = e.clientY;
        handleSwipe(startX, startY, endX, endY, threshold);
        isDragging = false;
      });

      container.addEventListener("mouseleave", () => {
        isDragging = false;
      });
    }

    function handleSwipe(startX, startY, endX, endY, threshold) {
      const diffX = endX - startX;
      const diffY = endY - startY;

      // 수평 이동 거리가 수직 이동 거리보다 크고, 임계값을 넘었을 때만 스와이프로 인정
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
        if (diffX > 0) {
          // 오른쪽으로 스와이프 -> 이전 파일
          prevMedia();
        } else {
          // 왼쪽으로 스와이프 -> 다음 파일
          nextMedia();
        }
      }
    }

    function toggleAdminModal(show) {
      const modal = document.getElementById("admin-modal");
      if (show) {
        renderAdminCategories();
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
        if (window.currentCategoryId) {
          openCategory(window.currentCategoryId);
        } else {
          goHome();
        }
      }
    }

    function renderAdminCategories() {
      const catList = document.getElementById("admin-category-list");
      document.getElementById("cat-count").innerText = window.categories.length;
      catList.innerHTML = "";

      if (!window.currentCategoryId && window.categories.length > 0) {
        window.currentCategoryId = window.categories[0].id;
      }

      window.categories.forEach(cat => {
        const isSelected = cat.id === window.currentCategoryId;
        const btn = document.createElement("button");
        btn.className = `w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold flex justify-between items-center transition ${isSelected ? 'bg-brand text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-200 border border-gray-200'}`;
        btn.onclick = () => { window.currentCategoryId = cat.id; renderAdminCategories(); };
        btn.innerHTML = `<span class="truncate">${cat.name}</span><span class="text-[10px] opacity-80 bg-black/10 px-1.5 py-0.5 rounded">${(window.mediaStorage[cat.id] || []).length}개</span>`;
        catList.appendChild(btn);
      });
      renderAdminMediaGrid();
    }

    function renderAdminMediaGrid() {
      const category = window.categories.find(c => c.id === window.currentCategoryId);
      const titleEl = document.getElementById("admin-selected-cat-title");
      const grid = document.getElementById("admin-media-grid");

      if (!category) {
        titleEl.innerText = "카테고리를 선택하세요";
        grid.innerHTML = "";
        return;
      }

      titleEl.innerText = category.name;
      const items = sortMediaArray(window.mediaStorage[window.currentCategoryId] || []);
      grid.innerHTML = "";

      items.forEach(item => {
        const itemCard = document.createElement("div");
        itemCard.className = "relative aspect-square border border-gray-200 rounded-lg overflow-hidden group bg-black";

        if (item.type && item.type.startsWith("image/")) {
          itemCard.innerHTML = `<img src="${item.dataUrl}" class="w-full h-full object-cover"><div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1"><p class="text-[10px] text-white truncate">${item.name}</p></div>`;
        } else {
          itemCard.innerHTML = `<video src="${item.dataUrl}" class="w-full h-full object-cover"></video><div class="absolute bottom-0 inset-x-0 bg-black/70 px-1.5 py-1"><p class="text-[10px] text-white truncate">${item.name}</p></div>`;
        }

        const delBtn = document.createElement("button");
        delBtn.className = "absolute top-1 right-1 w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center text-xs opacity-90 hover:opacity-100 shadow";
        delBtn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          await window.dbOps.deleteMedia(item.id);
        };

        itemCard.appendChild(delBtn);
        grid.appendChild(itemCard);
      });
    }

    function compressImage(file, maxWidth = 1024, quality = 0.7) {
      return new Promise((resolve) => {
        if (!file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFileUpload(event) {
      const fileList = event.target.files;
      if (!fileList || fileList.length === 0 || !window.currentCategoryId) return;

      const validFiles = Array.from(fileList).filter(f => f.type && (f.type.startsWith("image/") || f.type.startsWith("video/")));
      if (validFiles.length === 0) { event.target.value = ""; return; }

      const baseTime = Date.now();
      for (let i = 0; i < validFiles.length; i++) {
        const file = validFiles[i];
        const dataUrl = await compressImage(file);
        const mediaId = "media_" + baseTime + "_" + i + "_" + Math.random().toString(36).substr(2, 5);
        const mediaObj = {
          categoryId: window.currentCategoryId,
          name: file.name,
          type: file.type,
          dataUrl: dataUrl,
          createdAt: baseTime + i
        };
        await window.dbOps.saveMedia(mediaId, mediaObj);
      }
      event.target.value = "";
    }

    async function addNewCategoryPrompt() {
      const name = prompt("새 카테고리 이름을 입력하세요:");
      if (name && name.trim()) {
        const catId = "cat_" + Date.now();
        const newCat = {
          name: name.trim(),
          order: window.categories.length
        };
        await window.dbOps.saveCategory(catId, newCat);
        window.currentCategoryId = catId;
      }
    }

    async function renameSelectedCategory() {
      const category = window.categories.find(c => c.id === window.currentCategoryId);
      if (!category) return;
      const newName = prompt("카테고리 이름 수정:", category.name);
      if (newName && newName.trim()) {
        category.name = newName.trim();
        await window.dbOps.saveCategory(category.id, { name: category.name, order: category.order });
      }
    }

    async function deleteSelectedCategory() {
      if (!window.currentCategoryId) return;
      if (confirm("이 카테고리와 내부의 모든 미디어 파일이 삭제됩니다. 계속하시겠습니까?")) {
        const catId = window.currentCategoryId;
        const items = window.mediaStorage[catId] || [];
        for (let item of items) {
          await window.dbOps.deleteMedia(item.id);
        }
        await window.dbOps.deleteCategory(catId);
        window.currentCategoryId = window.categories.length > 0 ? window.categories[0].id : null;
        renderAdminCategories();
      }
    }

    function openCategoryAdminFromGallery() {
      toggleAdminModal(true);
    }
  </script>
