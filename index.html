<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>제이텍 단열탄성 고객상담 카탈로그</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 초기 헤더 레이아웃 복원 */
        header { 
            background: #ffffff; 
            border-bottom: 2px solid #e2e8f0; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 70px; 
            position: relative;
        }
        
        .logo-area { display: flex; align-items: center; }
        .logo-box { 
            border: 2px solid #1d4ed8; 
            padding: 4px 12px; 
            text-align: center; 
            font-weight: bold; 
            color: #1d4ed8; 
            font-size: 14px; 
            background: #eff6ff; 
            line-height: 1.2;
        }
        
        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
        }

        .admin-btn { 
            background: #1d4ed8; 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 13px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .admin-btn:hover { background: #1e40af; }
        
        /* 메인 10개 카테고리 그리드 복원 */
        main { 
            flex: 1; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            gap: 16px; 
            height: calc(100vh - 70px); 
        }
        
        .category-card { 
            background: white; 
            border: 3px solid #1d4ed8; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
        }
        .category-card:active { transform: scale(0.97); background: #eff6ff; }
        .category-title { font-size: 20px; font-weight: bold; color: #1e293b; }

        /* 모달 및 상세 화면 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; height: 90%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px 20px; background: #1d4ed8; color: white; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .modal-body { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; align-content: start; }
        
        .media-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; border: 2px solid #cbd5e1; }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
        .delete-media { position: absolute; top: 5px; right: 5px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .upload-box { border: 3px dashed #94a3b8; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1; cursor: pointer; background: #f1f5f9; color: #64748b; font-weight: bold; }
        .upload-box:hover { background: #e2e8f0; border-color: #64748b; }

        /* 전체화면 미디어 플레이어 */
        .fullscreen-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; justify-content: center; align-items: center; }
        .viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 2010; }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; font-size: 40px; padding: 20px; cursor: pointer; z-index: 2010; }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-box">
                JTECH<br><span style="font-size:10px;">SINCE 2010 단열탄성 제이텍</span>
            </div>
        </div>
        <div class="header-title">고객상담 카탈로그</div>
        <button class="admin-btn" onclick="openAdminModal()">항목/미디어 관리</button>
    </header>

    <main id="categoryGrid"></main>

    <div id="mediaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">카테고리</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="mediaListContainer"></div>
        </div>
    </div>

    <div id="fullscreenViewer" class="fullscreen-viewer">
        <button class="viewer-close" onclick="closeFullscreen()">&times;</button>
        <button class="nav-arrow nav-prev" onclick="moveMedia(-1)">&#10094;</button>
        <button class="nav-arrow nav-next" onclick="moveMedia(1)">&#10095;</button>
        <div id="fullscreenContent" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <input type="file" id="fileInput" style="display:none" accept="image/*,video/*" multiple onchange="handleFiles(event)">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        let db;
        const defaultCategories = ["사업자", "인증서", "시공전", "시공후", "자재안내", "시공과정", "가격표", "A/S규정", "고객후기", "기타안내"];
        let categories = [...defaultCategories];
        let currentCategory = "";
        let currentMediaItems = [];
        let currentViewerIndex = 0;

        const request = indexedDB.open("JTechConsultingDB", 1);
        request.onerror = () => alert("데이터베이스를 열 수 없습니다.");
        request.onsuccess = (e) => {
            db = e.target.result;
            loadCategories();
        };
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("media")) {
                db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("categories")) {
                db.createObjectStore("categories", { keyPath: "name" });
            }
        };

        function loadCategories() {
            const transaction = db.transaction(["categories"], "readonly");
            const store = transaction.objectStore("categories");
            const req = store.getAll();
            req.onsuccess = () => {
                if (req.result.length > 0) {
                    categories = req.result.map(item => item.name);
                    renderCategories();
                } else {
                    const writeTx = db.transaction(["categories"], "readwrite");
                    const writeStore = writeTx.objectStore("categories");
                    defaultCategories.forEach(cat => writeStore.put({ name: cat }));
                    writeTx.oncomplete = () => {
                        categories = [...defaultCategories];
                        renderCategories();
                    };
                }
            };
        }

        function renderCategories() {
            const grid = document.getElementById("categoryGrid");
            grid.innerHTML = "";
            categories.forEach(cat => {
                const card = document.createElement("div");
                card.className = "category-card";
                card.innerHTML = `<div class="category-title">${cat}</div>`;
                card.onclick = () => openCategory(cat);
                grid.appendChild(card);
            });
        }

        function openCategory(catName) {
            currentCategory = catName;
            document.getElementById("modalTitle").innerText = catName + " 관리 및 보기";
            document.getElementById("mediaModal").style.display = "flex";
            loadMediaItems();
        }

        function closeModal() {
            document.getElementById("mediaModal").style.display = "none";
        }

        function loadMediaItems() {
            const container = document.getElementById("mediaListContainer");
            container.innerHTML = `
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <span style="font-size:30px; margin-bottom:5px;">+</span>
                    <span>사진/동영상 추가</span>
                </div>
            `;

            const transaction = db.transaction(["media"], "readonly");
            const store = transaction.objectStore("media");
            const req = store.getAll();

            req.onsuccess = () => {
                currentMediaItems = req.result.filter(item => item.category === currentCategory);
                currentMediaItems.forEach((item, index) => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "media-item";
                    
                    const blobUrl = URL.createObjectURL(item.file);
                    if (item.file.type.startsWith("video")) {
                        itemDiv.innerHTML = `<video src="${blobUrl}"></video>`;
                    } else {
                        itemDiv.innerHTML = `<img src="${blobUrl}">`;
                    }
                    
                    itemDiv.onclick = (e) => {
                        if(!e.target.classList.contains("delete-media")) {
                            openFullscreen(index);
                        }
                    };

                    const delBtn = document.createElement("button");
                    delBtn.className = "delete-media";
                    delBtn.innerHTML = "&times;";
                    delBtn.onclick = () => deleteMedia(item.id);
                    itemDiv.appendChild(delBtn);

                    container.appendChild(itemDiv);
                });
            };
        }

        function handleFiles(event) {
            const files = event.target.files;
            if (!files.length) return;

            const transaction = db.transaction(["media"], "readwrite");
            const store = transaction.objectStore("media");

            let count = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const req = store.add({ category: currentCategory, file: file });
                req.onsuccess = () => {
                    count++;
                    if (count === files.length) {
                        loadMediaItems();
                    }
                };
            }
            event.target.value = "";
        }

        function deleteMedia(id) {
            if(!confirm("해당 미디어를 삭제하시겠습니까?")) return;
            const transaction = db.transaction(["media"], "readwrite");
            const store = transaction.objectStore("media");
            const req = store.delete(id);
            req.onsuccess = () => loadMediaItems();
        }

        function openAdminModal() {
            let newCat = prompt("추가할 카테고리 이름을 입력하세요:", "");
            if (newCat) {
                newCat = newCat.trim();
                if (categories.includes(newCat)) {
                    alert("이미 존재하는 카테고리입니다.");
                    return;
                }
                const transaction = db.transaction(["categories"], "readwrite");
                const store = transaction.objectStore("categories");
                store.put({ name: newCat }).onsuccess = () => {
                    loadCategories();
                };
            }
        }

        function openFullscreen(index) {
            currentViewerIndex = index;
            document.getElementById("fullscreenViewer").style.display = "flex";
            renderFullscreenMedia();
        }

        function closeFullscreen() {
            document.getElementById("fullscreenViewer").style.display = "none";
            document.getElementById("fullscreenContent").innerHTML = "";
        }

        function renderFullscreenMedia() {
            const container = document.getElementById("fullscreenContent");
            container.innerHTML = "";
            if (currentMediaItems.length === 0) return;

            const item = currentMediaItems[currentViewerIndex];
            const blobUrl = URL.createObjectURL(item.file);

            if (item.file.type.startsWith("video")) {
                const video = document.createElement("video");
                video.src = blobUrl;
                video.controls = true;
                video.autoplay = true;
                video.style.maxWidth = "100%";
                video.style.maxHeight = "100%";
                container.appendChild(video);
            } else {
                const img = document.createElement("img");
                img.src = blobUrl;
                img.style.maxWidth = "100%";
                img.style.maxHeight = "100%";
                img.style.objectFit = "contain";
                container.appendChild(img);
            }
        }

        function moveMedia(direction) {
            currentViewerIndex += direction;
            if (currentViewerIndex < 0) {
                currentViewerIndex = currentMediaItems.length - 1;
            } else if (currentViewerIndex >= currentMediaItems.length) {
                currentViewerIndex = 0;
            }
            renderFullscreenMedia();
        }
    </script>
</body>
</html>
