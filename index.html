<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JTECH 단열탄성 상담 시스템 (공용)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4396">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/1b4396/ffffff?text=JTECH">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (Modular v9) - Firestore 및 Storage 추가 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAu_nhpHAOKOuozcp7dI8ywBf5g3aKFQk",
      authDomain: "jtech-01.firebaseapp.com",
      projectId: "jtech-01",
      storageBucket: "jtech-01.firebasestorage.app",
      messagingSenderId: "467197970168",
      appId: "1:467197970168:web:1220210ce33675549f9d0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.dbOps = { getDocs, collection, doc, setDoc, deleteDoc, onSnapshot };
    window.storageOps = { ref, uploadBytesResumable, getDownloadURL, deleteObject };

    // 파일 업로드 핸들러 (진행 상태 로딩 바 포함)
    window.handleFileUpload = async function(event) {
      const fileList = event.target.files;
      if (!fileList || fileList.length === 0 || !window.currentCategoryId) return;

      const validFiles = Array.from(fileList).filter(f => f.type && (f.type.startsWith("image/") || f.type.startsWith("video/")));
      if (validFiles.length === 0) { 
        event.target.value = ""; 
        return; 
      }

      // 로딩 바 모달 표시
      const progressModal = document.getElementById('upload-progress-modal');
      const progressBar = document.getElementById('upload-progress-bar');
      const progressText = document.getElementById('upload-progress-text');
      
      if (progressModal) progressModal.classList.remove('hidden');

      const baseTime = Date.now();

      try {
        for (let i = 0; i < validFiles.length; i++) {
          const file = validFiles[i];
          
          // 한글/특수문자 파일명으로 인한 404/CORS 오류 원천 차단 (타임스탬프 + 안전한 이름 변환)
          const cleanName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
          const safeFileName = `${baseTime}_${i}_${cleanName}`;
          const storagePath = `media/${safeFileName}`;
          
          const storageRef = ref(storage, storagePath);
          const uploadTask = uploadBytesResumable(storageRef, file);

          await new Promise((resolve, reject) => {
            uploadTask.on('state_changed', 
              (snapshot) => {
                const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                if (progressBar) progressBar.style.width = `${progress}%`;
                if (progressText) progressText.innerText = `업로드 중... (${i + 1}/${validFiles.length}) ${progress}%`;
              }, 
              (error) => {
                console.error("업로드 실패:", error);
                reject(error);
              }, 
              async () => {
                const downloadUrl = await getDownloadURL(uploadTask.snapshot.ref);
                const mediaId = "media_" + baseTime + "_" + i + "_" + Math.random().toString(36).substring(2, 7);
                const mediaObj = {
                  categoryId: window.currentCategoryId,
                  name: file.name,
                  type: file.type,
                  dataUrl: downloadUrl,
                  storagePath: storagePath,
                  createdAt: baseTime + i
                };
                await setDoc(doc(db, "media", mediaId), mediaObj);
                resolve();
              }
            );
          });
        }
        alert("모든 파일이 성공적으로 업로드되었습니다!");
      } catch (err) {
        alert("업로드 중 오류가 발생했습니다. 콘솔창을 확인해주세요.");
        console.error(err);
      } finally {
        if (progressModal) progressModal.classList.add('hidden');
        if (progressBar) progressBar.style.width = '0%';
        event.target.value = "";
        // 업로드 후 목록 새로고침 함수가 있다면 여기서 호출
        if (typeof window.loadMediaList === 'function') {
          window.loadMediaList(window.currentCategoryId);
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 메인 컨테이너 레이아웃 예시 -->
  <div class="max-w-4xl mx-auto p-4">
    <header class="bg-blue-900 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
      <h1 class="text-xl font-bold"><i class="fa-solid fa-paint-roller mr-2"></i>JTECH 단열탄성 상담 시스템</h1>
    </header>

    <!-- 업로드 버튼 영역 예시 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <label class="block mb-2 font-semibold text-slate-700">시공 사진 및 동영상 첨부</label>
      <input type="file" multiple accept="image/*,video/*" onchange="window.handleFileUpload(event)" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
    </div>
  </div>

  <!-- 업로드 진행 상태 로딩 바 모달 -->
  <div id="upload-progress-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-80 text-center">
      <div class="text-blue-600 text-3xl mb-3"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <h3 id="upload-progress-text" class="font-bold text-slate-700 mb-4">업로드 준비 중...</h3>
      <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
        <div id="upload-progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>
  </div>

</body>
</html>
