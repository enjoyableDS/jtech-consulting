<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JTECH 단열탄성 상담 시스템 (공용)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4396">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/1b4396/ffffff?text=JTECH">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Modular v9) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAu_nhpHAOKOuozczp7dI8ywBfSg3aKfQk",
      authDomain: "jtech-01.firebaseapp.com",
      projectId: "jtech-01",
      storageBucket: "jtech-01.firebasestorage.app",
      messagingSenderId: "467197970168",
      appId: "1:467197970168:web:1220210ce33675549f9d0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DEFAULT_CATEGORIES = [
      "사업자", "인증서", "시공전", "시공후", "자재안내",
      "시공과정", "가격표", "A/S규정", "고객후기", "기타안내"
    ];

    window.categories = [];
    window.mediaStorage = {};
    window.currentCategoryId = null;
    window.currentMediaList = [];
    window.currentViewerIndex = 0;
    window.isFitContain = true;
    window.currentSortOrder = "asc";
    let isInitialized = false;

    // 실시간 데이터 동기화 리스너 설정
    window.initFirebaseSync = async function() {
      const catSnapshot = await getDocs(collection(db, "categories"));
      if (catSnapshot.empty) {
        for (let i = 0; i < DEFAULT_CATEGORIES.length; i++) {
          const catId = "cat_" + Date.now() + "_" + i;
          await setDoc(doc(db, "categories", catId), { name: DEFAULT_CATEGORIES[i], order: i });
        }
      }

      // 1. 카테고리 실시간 동기화
      onSnapshot(collection(db, "categories"), (snapshot) => {
        let loadedCats = [];
        snapshot.forEach((docSnap) => {
          loadedCats.push({ id: docSnap.id, ...docSnap.data() });
        });

        window.categories = loadedCats.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        if (!window.currentCategoryId && window.categories.length > 0) {
          window.currentCategoryId = window.categories[0].id;
        }
        renderCategoryGrid();
        if (!document.getElementById("admin-modal").classList.contains("hidden")) {
          renderAdminCategories();
        }
      });

      // 2. 미디어 파일 실시간 동기화
      onSnapshot(collection(db, "media"), (snapshot) => {
        window.mediaStorage = {};
        window.categories.forEach(c => window.mediaStorage[c.id] = []);
        
        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          if (!window.mediaStorage[item.categoryId]) {
            window.mediaStorage[item.categoryId] = [];
          }
          window.mediaStorage[item.categoryId].push(item);
        });

        renderCategoryGrid();
        if (window.currentCategoryId) {
          if (!document.getElementById("view-gallery").classList.contains("hidden")) {
            openCategory(window.currentCategoryId);
          }
          if (!document.getElementById("admin-modal").classList.contains("hidden")) {
            renderAdminMediaGrid();
          }
        }
      });
    };

    window.dbOps = {
      saveCategory: async (id, data) => {
        await setDoc(doc(db, "categories", id), data, { merge: true });
      },
      deleteCategory: async (id) => {
        await deleteDoc(doc(db, "categories", id));
      },
      saveMedia: async (id, data) => {
        await setDoc(doc(db, "media", id), data, { merge: true });
      },
      deleteMedia: async (id) => {
        await deleteDoc(doc(db, "media", id));
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.initFirebaseSync();
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#1b4396',
            brandDark: '#122e69',
            brandLight: '#eef3fc'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    
    /* 모바일 터치 및 가로 스크롤 최적화 */
    .custom-scrollbar {-webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; overscroll-behavior-x: contain;}
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    
    .media-fit-contain { object-fit: contain; }
    .media-fit-cover { object-fit: cover; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen h-[100dvh] flex flex-col overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col gap-3 shadow-sm shrink-0 z-10">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex flex-col items-center justify-center border-2 border-brand px-4 py-1.5 rounded-md cursor-pointer" onclick="goHome()">
          <span class="text-2xl font-black tracking-wider text-brand leading-none">JTECH</span>
          <span class="text-[10px] font-bold text-gray-500 tracking-tighter mt-0.5">SINCE 2010</span>
          <span class="text-[11px] font-extrabold text-brand tracking-widest leading-none mt-0.5">단열탄성 제이텍</span>
        </div>
      </div>

      <div id="header-title" class="text-xl font-bold text-brand flex items-center gap-2">
        <span>고객 상담 카탈로그</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="goHome()" id="btn-home" class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-brand font-bold flex items-center gap-2 text-sm transition">
          <i class="fa-solid fa-house"></i> 메인으로
        </button>
        <button onclick="toggleAdminModal(true)" class="px-4 py-2 bg-brand hover:bg-brandDark text-white rounded-lg font-bold flex items-center gap-2 text-sm shadow transition">
          <i class="fa-solid fa-gear"></i> 항목/미디어 관리
        </button>
      </div>
    </div>

    <!-- TOP CATEGORY MENU BAR (PC 중앙정렬 및 모바일 가로 스크롤 구조) -->
    <nav id="top-category-bar" class="overflow-x-auto custom-scrollbar pb-2 pt-1 border-t border-gray-100 w-full whitespace-nowrap px-1">
      <div id="top-category-inner" class="flex items-center justify-start sm:justify-center gap-2 min-w-max mx-auto"></div>
    </nav>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main class="flex-1 min-h-0 relative overflow-y-auto custom-scrollbar p-6">
    <!-- 1. CATEGORY GRID VIEW -->
    <div id="view-categories" class="max-w-7xl mx-auto min-h-full flex flex-col justify-center py-2">
      <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 my-auto pb-6">
      </div>
    </div>

    <!-- 2. MEDIA GALLERY GRID VIEW -->
    <div id="view-gallery" class="hidden max-w-7xl mx-auto pb-12">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100 sticky top-0 z-10">
        <div>
          <h2 id="current-category-name" class="text-2xl font-bold text-brand">시공전</h2>
          <p id="current-category-count" class="text-xs text-gray-500 mt-0.5">총 0개의 미디어</p>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex items-center bg-gray-100 rounded-lg px-3 py-1.5 border border-gray-200">
            <i class="fa-solid fa-arrow-down-a-z text-brand text-xs mr-2"></i>
            <select id="gallery-sort-select" onchange="changeSortOrder(this.value)" class="bg-transparent text-xs font-bold text-gray-700 focus:outline-none cursor-pointer">
              <option value="asc">이름 오름차순 (기본)</option>
              <option value="desc">이름 내림차순</option>
              <option value="created">등록순</option>
            </select>
          </div>
          <button onclick="goHome()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg text-sm flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-left"></i> 뒤로가기
          </button>
        </div>
      </div>
      <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pb-8"></div>
      <div id="gallery-empty" class="hidden flex-col items-center justify-center py-20 text-center">
        <i class="fa-regular fa-folder-open text-6xl text-gray-300 mb-3"></i>
        <p class="text-gray-500 font-medium">등록된 사진이나 동영상이 없습니다.</p>
        <button onclick="openCategoryAdminFromGallery()" class="mt-4 px-4 py-2 bg-brand text-white text-sm font-semibold rounded-lg shadow">+ 파일 추가하기</button>
      </div>
    </div>
  </main>

  <!-- 3. FULLSCREEN MEDIA VIEWER MODAL -->
  <div id="viewer-modal" class="fixed inset-0 bg-black z-50 hidden flex flex-col items-center justify-center select-none">
    <div id="viewer-header" class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-20 flex justify-between items-center transition-opacity duration-300">
      <div class="text-white">
        <span id="viewer-category-tag" class="text-xs bg-brand text-white px-2.5 py-1 rounded-full font-bold">카테고리</span>
        <h3 id="viewer-title" class="text-base font-medium mt-1 truncate max-w-md">파일명</h3>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleMediaFit()" title="화면 맞춤 전환" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center backdrop-blur-md transition">
          <i id="fit-icon" class="fa-solid fa-expand"></i>
        </button>
        <button onclick="closeViewer()" title="닫기" class="w-10 h-10 rounded-full bg-white/20 hover:bg-red-600 text-white flex items-center justify-center backdrop-blur-md transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
    </div>
    <div class="w-full h-full flex items-center justify-center relative overflow-hidden" id="viewer-container">
      <img id="viewer-image" src="" alt="Full view" class="w-full h-full media-fit-contain hidden">
      <video id="viewer-video" controls class="w-full h-full media-fit-contain hidden" playsinline></video>
    </div>
    <button onclick="prevMedia()" class="absolute left-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-md z-20 transition border border-white/20"><i class="fa-solid fa-chevron-left text-2xl"></i></button>
    <button onclick="nextMedia()" class="absolute right-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center backdrop-blur-md z-20 transition border border-white/20"><i class="fa-solid fa-chevron-right text-2xl"></i></button>
    <div id="viewer-footer" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full text-white text-xs font-semibold z-20">
      <span id="viewer-index">1</span> / <span id="viewer-total">1</span>
    </div>
  </div>

  <!-- 4. ADMIN & MEDIA MANAGEMENT MODAL -->
  <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
      <div class="px-6 py-4 bg-brand text-white flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-sliders text-xl"></i>
          <h3 class="text-lg font-bold">카테고리 및 미디어 콘텐츠 관리자 (공용 동기화)</h3>
        </div>
        <button onclick="toggleAdminModal(false)" class="text-white/80 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex-1 min-h-0 overflow-hidden grid grid-cols-1 md:grid-cols-3">
        <div class="p-4 border-r border-gray-200 flex flex-col bg-gray-50 min-h-0 h-full">
          <div class="flex justify-between items-center mb-3 shrink-0">
            <h4 class="font-bold text-gray-700 text-sm">카테고리 목록 (<span id="cat-count">0</span>)</h4>
            <button onclick="addNewCategoryPrompt()" class="text-xs bg-brand text-white px-2.5 py-1 rounded hover:bg-brandDark font-semibold">+ 항목 추가</button>
          </div>
          <div id="admin-category-list" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar space-y-1.5 pr-1"></div>
        </div>
        <div class="md:col-span-2 p-5 flex flex-col min-h-0 h-full bg-white overflow-y-auto custom-scrollbar">
          <div class="flex justify-between items-center pb-3 border-b border-gray-200 mb-4 shrink-0">
            <div>
              <span class="text-xs text-brand font-bold tracking-wide uppercase">선택된 카테고리</span>
              <h4 id="admin-selected-cat-title" class="text-xl font-bold text-gray-800">카테고리를 선택하세요</h4>
            </div>
            <div class="flex gap-2">
              <button onclick="renameSelectedCategory()" class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-semibold">이름 변경</button>
              <button onclick="deleteSelectedCategory()" class="px-3 py-1.5 text-xs bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-semibold">카테고리 삭제</button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 shrink-0">
            <label class="border-2 border-dashed border-gray-300 hover:border-brand rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer bg-gray-50 hover:bg-brandLight/30 transition text-center">
              <i class="fa-solid fa-cloud-arrow-up text-2xl text-brand mb-1.5"></i>
              <span class="text-sm font-bold text-gray-700">사진/동영상 파일 선택</span>
              <input type="file" id="media-file-input" multiple accept="image/*,video/*" class="hidden" onchange="handleFileUpload(event)">
            </label>
            <label class="border-2 border-dashed border-brand/40 hover:border-brand rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer bg-brandLight/20 hover:bg-brandLight/50 transition text-center">
              <i class="fa-solid fa-folder-plus text-2xl text-brand mb-1.5"></i>
              <span class="text-sm font-bold text-brand">폴더 통째로 가져오기</span>
              <input type="file" id="media-folder-input" webkitdirectory directory multiple class="hidden" onchange="handleFileUpload(event)">
            </label>
          </div>
          <div id="admin-media-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 pb-6"></div>
        </div>
      </div>
      <div class="px-6 py-3 bg-gray-100 border-t border-gray-200 flex justify-between items-center text-xs text-gray-500 shrink-0">
        <span>* 클라우드 DB 연동으로 접속한 모든 기기에서 실시간 동기화됩니다.</span>
        <button onclick="toggleAdminModal(false)" class="px-5 py-2 bg-brand text-white font-bold rounded-lg hover:bg-brandDark transition">완료 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- CLIENT
