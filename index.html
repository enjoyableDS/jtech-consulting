<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JTECH 단열탄성 상담 시스템 (공용)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b4396">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/1b4396/ffffff?text=JTECH">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (Modular v9) - Firestore 및 Storage 추가 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAu_nhHAOKOuozcp7dI8ywBfSg3akFQK",
      authDomain: "jtech-01.firebaseapp.com",
      projectId: "jtech-01",
      storageBucket: "jtech-01.firebasestorage.app",
      messagingSenderId: "467197970168",
      appId: "1:467197970168:web:1220210ce33675549f9d0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 전역 객체로 등록하여 일반 스크립트에서도 사용 가능하게 함
    window.db = db;
    window.storage = storage;
    window.collection = collection;
    window.getDocs = getDocs;
    window.doc = doc;
    window.setDoc = setDoc;
    window.deleteDoc = deleteDoc;
    window.onSnapshot = onSnapshot;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    window.deleteObject = deleteObject;

    // 기본 카테고리 정의
    const DEFAULT_CATEGORIES = [
      "기본 시공 갤러리",
      "에어로겔 특화",
      "세라믹 비교",
      "줄눈 & 나노코팅",
      "수입중문 (리마데시오)"
    ];

    // 실시간 데이터 동기화 리스너 설정
    window.initFirebaseSync = async function() {
      try {
        const catSnapshot = await getDocs(collection(db, "categories"));
        if (catSnapshot.empty) {
          for (let i = 0; i < DEFAULT_CATEGORIES.length; i++) {
            const catId = "cat_" + Date.now() + "_" + i;
            await setDoc(doc(db, "categories", catId), { name: DEFAULT_CATEGORIES[i], order: i });
          }
        }
      } catch (err) {
        console.error("초기 카테고리 생성 중 오류 발생:", err);
      }

      // 1. 카테고리 실시간 동기화
      onSnapshot(collection(db, "categories"), (snapshot) => {
        let loadedCats = [];
        snapshot.forEach((docSnap) => {
          loadedCats.push({ id: docSnap.id, ...docSnap.data() });
        });

        window.categories = loadedCats.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        
        if (!window.currentCategoryId && window.categories.length > 0) {
          window.currentCategoryId = window.categories[0].id;
        }
        
        if (typeof renderCategoryGrid === "function") {
          renderCategoryGrid();
        }
        
        const adminModal = document.getElementById("admin-modal");
        if (adminModal && !adminModal.classList.contains("hidden")) {
          if (typeof renderAdminCategories === "function") renderAdminCategories();
        }
      }, (error) => {
        console.error("카테고리 실시간 동기화 에러:", error);
      });

      // 2. 미디어 파일 실시간 동기화
      onSnapshot(collection(db, "media"), (snapshot) => {
        window.mediaStorage = {};
        if (window.categories) {
          window.categories.forEach(c => window.mediaStorage[c.id] = []);
        }
        
        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          if (!window.mediaStorage[item.categoryId]) {
            window.mediaStorage[item.categoryId] = [];
          }
          window.mediaStorage[item.categoryId].push(item);
        });

        if (typeof renderCategoryGrid === "function") {
          renderCategoryGrid();
        }
        if (window.currentCategoryId) {
          const viewGallery = document.getElementById("view-gallery");
          if (viewGallery && !viewGallery.classList.contains("hidden")) {
            if (typeof openCategory === "function") openCategory(window.currentCategoryId);
          }
          const adminModal = document.getElementById("admin-modal");
          if (adminModal && !adminModal.classList.contains("hidden")) {
            if (typeof renderAdminMediaGrid === "function") renderAdminMediaGrid();
          }
        }
      }, (error) => {
        console.error("미디어 실시간 동기화 에러:", error);
      });
    };

    // 자동 실행
    window.addEventListener("DOMContentLoaded", () => {
      window.initFirebaseSync();
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <!-- 상단 헤더 영역 -->
  <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold tracking-tight">JTECH 탄성코트 상담 시스템</h1>
      <button onclick="openAdminModal()" class="text-xs bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded border border-blue-600 transition">
        <i class="fa-solid fa-gear mr-1"></i> 관리자 모드
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto px-4 py-6">
    <div id="view-home">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-slate-900 mb-1">시공 카테고리 선택</h2>
        <p class="text-sm text-slate-500">원하시는 항목을 선택하여 상세 갤러리와 시공 사례를 확인하세요.</p>
      </div>
      <!-- 카테고리 그리드 렌더링 영역 -->
      <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- 동적 로드됨 -->
      </div>
    </div>

    <!-- 갤러리 뷰 (기본 숨김) -->
    <div id="view-gallery" class="hidden">
      <button onclick="goHome()" class="mb-4 text-sm text-blue-600 font-medium hover:underline flex items-center">
        <i class="fa-solid fa-arrow-left mr-1.5"></i> 홈으로 돌아가기
      </button>
      <h2 id="gallery-title" class="text-xl font-bold text-slate-900 mb-4"></h2>
      <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <!-- 미디어 항목 로드됨 -->
      </div>
    </div>
  </main>

  <!-- 관리자 모달 -->
  <div id="admin-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b flex justify-between items-center bg-slate-100">
        <h3 class="font-bold text-slate-800">시스템 관리자</h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto flex-1 space-y-6">
        <div>
          <h4 class="text-sm font-semibold text-slate-700 mb-2">카테고리 관리</h4>
          <div id="admin-categories" class="space-y-2"></div>
        </div>
        <div>
          <h4 class="text-sm font-semibold text-slate-700 mb-2">미디어 관리</h4>
          <div id="admin-media-grid" class="grid grid-cols-3 gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 기본 UI 로직 스크립트 -->
  <script>
    window.categories = [];
    window.mediaStorage = {};
    window.currentCategoryId = null;

    function renderCategoryGrid() {
      const grid = document.getElementById("category-grid");
      if (!grid) return;
      grid.innerHTML = "";

      if (!window.categories || window.categories.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 text-sm">등록된 카테고리가 없습니다.</div>`;
        return;
      }

      window.categories.forEach(cat => {
        const count = (window.mediaStorage[cat.id] || []).length;
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition cursor-pointer flex justify-between items-center";
        card.onclick = () => openCategory(cat.id);
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-slate-800 text-base mb-1">${cat.name}</h3>
            <span class="text-xs text-slate-500">컨텐츠 ${count}개</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300"></i>
        `;
        grid.appendChild(card);
      });
    }

    function openCategory(catId) {
      window.currentCategoryId = catId;
      const cat = window.categories.find(c => c.id === catId);
      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-gallery").classList.remove("hidden");
      document.getElementById("gallery-title").innerText = cat ? cat.name : "상세 갤러리";

      const mediaGrid = document.getElementById("media-grid");
      mediaGrid.innerHTML = "";
      const items = window.mediaStorage[catId] || [];

      if (items.length === 0) {
        mediaGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">등록된 이미지나 영상이 없습니다.</div>`;
        return;
      }

      items.forEach(item => {
        const el = document.createElement("div");
        el.className = "bg-slate-100 rounded-lg overflow-hidden aspect-square border border-slate-200";
        el.innerHTML = `<img src="${item.url || item.imageUrl}" class="w-full h-full object-cover" alt="시공 사례">`;
        mediaGrid.appendChild(el);
      });
    }

    function goHome() {
      document.getElementById("view-gallery").classList.add("hidden");
      document.getElementById("view-home").classList.remove("hidden");
      window.currentCategoryId = null;
    }

    function openAdminModal() {
      document.getElementById("admin-modal").classList.remove("hidden");
      renderAdminCategories();
      renderAdminMediaGrid();
    }

    function closeAdminModal() {
      document.getElementById("admin-modal").classList.add("hidden");
    }

    function renderAdminCategories() {
      const container = document.getElementById("admin-categories");
      if (!container) return;
      container.innerHTML = "";
      window.categories.forEach(cat => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-slate-50 p-2.5 rounded border border-slate-200 text-sm";
        row.innerHTML = `<span>${cat.name}</span><span class="text-xs text-slate-400">ID: ${cat.id}</span>`;
        container.appendChild(row);
      });
    }

    function renderAdminMediaGrid() {
      const container = document.getElementById("admin-media-grid");
      if (!container) return;
      container.innerHTML = "";
      // 관리자 미디어 요약 표현
    }
  </script>
</body>
</html>
